name: CI BurnGeoFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Teste do orquestrador
        run: python -m unittest discover -s tests -p "test_pipeline.py" -v
      - name: Executar caso base
        run: python executar_pipeline.py --id 24340828 --baixar-exemplo --saida .
      - name: Perfil legado de leitura e serializacao (baseline)
        run: |
          mkdir -p .benchmark-execucoes/24340828
          ln -s "$PWD/dados" .benchmark-execucoes/24340828/dados
          ln -s "$PWD/resultados" .benchmark-execucoes/24340828/resultados
          python scripts/perfil_visualizador_legado.py --base .benchmark-execucoes --id 24340828 --repeticoes 3
      - name: Testes cientificos originais
        run: python -m unittest discover -s tests -v
      - name: Conferir retomada
        run: |
          python executar_pipeline.py --id 24340828 --saida .
          python -c "import json; m=json.load(open('execucao.json')); assert len(m['etapas'])==8 and all(x['status']=='concluido' for x in m['etapas'].values())"
      - name: Anexar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burngeoflow-24340828
          path: |
            execucao.json
            logs/
          retention-days: 14

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias da API e do pipeline base
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Contratos REST, GeoJSON e integridade
        run: python -m unittest discover -s backend/tests -v
      - name: Executar caso base para comparar medicao
        run: python executar_pipeline.py --id 24340828 --baixar-exemplo
      - name: Baseline legado (mesmos arquivos)
        run: python scripts/perfil_visualizador_legado.py --base execucoes --id 24340828 --repeticoes 3
      - name: Indexacao e consultas por data
        run: python -m scripts.perfil_indice_api --base execucoes --id 24340828 --repeticoes 5

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar frontend (lock versionado)
        working-directory: frontend
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Testes unitarios de formatacao
        working-directory: frontend
        run: npm run test
      - name: TypeScript e build Vite
        working-directory: frontend
        run: npm run build
      - name: Garantia de carregamento inicial leve
        working-directory: frontend
        run: npm run check:bundle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Smoke test do React compilado servido pelo FastAPI
        run: |
          python -m pip install -r requirements-dev.txt
          python - <<'PY'
          from pathlib import Path
          from re import search
          from fastapi.testclient import TestClient
          from backend.app.main import criar_app
          dist = Path("frontend/dist")
          assert (dist / "index.html").is_file()
          with TestClient(criar_app(frontend_dist=dist)) as client:
              pagina = client.get("/")
              assert pagina.status_code == 200
              assert "BurnGeoFlow" in pagina.text
              js = search(r'/assets/[^" ]+[.]js', pagina.text)
              assert js is not None, pagina.text
              asset = client.get(js.group(0))
              assert asset.status_code == 200
              assert client.get("/api/health").json()["status"] == "ok"
          print("[OK] React compilado e API na mesma porta")
          PY
      - name: Smoke test em Chromium real (React, WebGL e API simulada)
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
          python scripts/smoke_browser.py
